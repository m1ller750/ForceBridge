workers_dev = true

[observability]
enabled = true

# ИИ доразбирает «зависшие» карточки раз в 10 минут.
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "forcebridge"
